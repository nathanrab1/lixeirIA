<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachable Machine → Arduino</title>
<style>
  :root { --tinta:#1c2321; --papel:#f2efe6; --fio:#c9c2ae; --sinal:#2f6f4e; --alerta:#a33b २1; }
  :root { --alerta:#a33b21; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.5rem;
    font: 16px/1.55 Georgia, serif;
    color: var(--tinta); background: var(--papel);
    max-width: 42rem; margin-inline: auto;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.75rem; color: #5a6360; font-size: .95rem; }
  label { display: block; font-size: .85rem; margin-bottom: .3rem; color: #5a6360; }
  input {
    width: 100%; padding: .6rem .7rem; border: 1px solid var(--fio);
    background: #fff; font: inherit; font-size: .9rem; border-radius: 3px;
  }
  .linha { display: flex; gap: .6rem; margin: 1.25rem 0; flex-wrap: wrap; }
  button {
    font: inherit; font-size: .9rem; padding: .6rem 1.1rem; cursor: pointer;
    border: 1px solid var(--tinta); background: var(--tinta); color: var(--papel);
    border-radius: 3px;
  }
  button.vazado { background: transparent; color: var(--tinta); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #camera { width: 260px; height: 260px; background: #ddd8ca; border-radius: 3px; }
  #camera canvas { display: block; border-radius: 3px; }
  #resultado { margin-top: 1rem; font-size: 1.05rem; min-height: 1.6em; }
  #resultado strong { color: var(--sinal); }
  #log {
    margin-top: 1.5rem; padding: 1rem; border: 1px solid var(--fio);
    background: #fbfaf6; border-radius: 3px;
    font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; max-height: 16rem; overflow-y: auto;
  }
  #log .ruim { color: var(--alerta); }
  #log .bom { color: var(--sinal); }
</style>
</head>
<body>

<h1>Teachable Machine → Arduino</h1>
<p class="sub">A classificação roda no navegador e vai para a placa pela porta serial. Use Chrome ou Edge.</p>

<label for="url">Link do modelo exportado (termina com uma barra)</label>
<input id="url" value="https://teachablemachine.withgoogle.com/models/EzAIuGER-/">

<div class="linha">
  <button id="btnTeste" class="vazado">1. Testar o modelo</button>
  <button id="btnModelo">2. Carregar modelo e câmera</button>
  <button id="btnSerial" class="vazado" disabled>3. Conectar ao Arduino</button>
</div>

<div id="camera"></div>
<div id="resultado"></div>
<div id="log"></div>

<script>
const painel = document.getElementById("log");
function reg(texto, tipo) {
  const linha = document.createElement("div");
  if (tipo) linha.className = tipo;
  linha.textContent = texto;
  painel.appendChild(linha);
  painel.scrollTop = painel.scrollHeight;
}

// ---- diagnóstico de ambiente ----
reg("origem: " + location.origin);
if (location.protocol === "file:") {
  reg("PROBLEMA: aberto como arquivo local. Câmera e fetch não funcionam assim.", "ruim");
  reg("Rode: python3 -m http.server 8000  e abra http://localhost:8000/", "ruim");
} else {
  reg("protocolo ok", "bom");
}
reg("Web Serial: " + ("serial" in navigator ? "disponível" : "AUSENTE — use Chrome ou Edge no computador"),
    "serial" in navigator ? "bom" : "ruim");

// ---- carregamento das bibliotecas com CDN reserva ----
function carregarScript(fontes) {
  return new Promise((ok, falha) => {
    let i = 0;
    (function tentar() {
      if (i >= fontes.length) return falha(new Error("nenhum CDN respondeu"));
      const alvo = fontes[i++];
      const s = document.createElement("script");
      s.src = alvo;
      s.onload = () => { reg("carregado: " + new URL(alvo).host, "bom"); ok(); };
      s.onerror = () => { reg("falhou: " + new URL(alvo).host, "ruim"); tentar(); };
      document.head.appendChild(s);
    })();
  });
}

let bibliotecasOk = false;
(async () => {
  try {
    await carregarScript([
      "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js",
      "https://unpkg.com/@tensorflow/tfjs@1.3.1/dist/tf.min.js"
    ]);
    await carregarScript([
      "https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js",
      "https://unpkg.com/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"
    ]);
    bibliotecasOk = typeof tmImage !== "undefined" && typeof tf !== "undefined";
    reg(bibliotecasOk ? "bibliotecas prontas" : "bibliotecas carregaram mas não expuseram tf/tmImage",
        bibliotecasOk ? "bom" : "ruim");
  } catch (e) {
    reg("ERRO ao carregar bibliotecas: " + e.message, "ruim");
    reg("Provável bloqueio de rede, firewall ou extensão do navegador.", "ruim");
  }
})();

// ---- utilidades ----
const base = () => document.getElementById("url").value.trim().replace(/\/?$/, "/");

// ---- 1. teste isolado do modelo ----
document.getElementById("btnTeste").onclick = async () => {
  const alvo = base() + "model.json";
  reg("testando " + alvo);
  try {
    const r = await fetch(alvo);
    reg("status HTTP: " + r.status, r.ok ? "bom" : "ruim");
    if (r.ok) {
      const j = await r.json();
      reg("model.json válido (formato: " + (j.format || "desconhecido") + ")", "bom");
    } else {
      reg("O modelo não está nesse endereço. Exporte de novo pela aba Upload e espere terminar.", "ruim");
    }
  } catch (e) {
    reg("fetch falhou: " + e.message, "ruim");
    reg("Isso é rede, não é o modelo: firewall, extensão ou página em file://", "ruim");
  }
};

// ---- 2. modelo e câmera, com erros separados ----
let modelo, webcam, writer, ultimaClasse = null;

document.getElementById("btnModelo").onclick = async () => {
  if (!bibliotecasOk) return reg("Bibliotecas não estão prontas. Resolva isso antes.", "ruim");

  try {
    reg("carregando modelo…");
    modelo = await tmImage.load(base() + "model.json", base() + "metadata.json");
    reg("modelo ok — " + modelo.getTotalClasses() + " classes", "bom");
  } catch (e) {
    reg("ERRO no modelo: " + e.message, "ruim");
    return;
  }

  try {
    reg("pedindo a câmera…");
    webcam = new tmImage.Webcam(260, 260, true);
    await webcam.setup();
    await webcam.play();
    document.getElementById("camera").appendChild(webcam.canvas);
    reg("câmera ok", "bom");
  } catch (e) {
    reg("ERRO na câmera: " + e.message, "ruim");
    reg("Veja se outro programa está usando a webcam e se a permissão foi concedida.", "ruim");
    return;
  }

  document.getElementById("btnSerial").disabled = false;
  loop();
};

async function loop() {
  webcam.update();
  const previsoes = await modelo.predict(webcam.canvas);
  const topo = previsoes.reduce((a, b) => (a.probability > b.probability ? a : b));

  document.getElementById("resultado").innerHTML =
    "<strong>" + topo.className + "</strong> — " + Math.round(topo.probability * 100) + "%";

  if (topo.probability > 0.9 && topo.className !== ultimaClasse) {
    ultimaClasse = topo.className;
    // Mapeia Class 1 → "1" e Class 2 → "0"
    if (topo.className === "Class 1") {
      enviar("1");
    } else if (topo.className === "Class 2") {
      enviar("0");
    }
  }
  requestAnimationFrame(loop);
}

// ---- 3. serial ----
document.getElementById("btnSerial").onclick = async () => {
  if (!("serial" in navigator)) return reg("Sem Web Serial neste navegador.", "ruim");
  try {
    const porta = await navigator.serial.requestPort();
    await porta.open({ baudRate: 9600 });
    writer = porta.writable.getWriter();
    reg("Arduino conectado. Feche o Monitor Serial da IDE.", "bom");
  } catch (e) {
    reg("ERRO na serial: " + e.message, "ruim");
  }
};

async function enviar(t) {
  if (!writer) return;
  await writer.write(new TextEncoder().encode(t + "\n"));
  reg("enviado: " + t);
}
</script>

</body>
</html>
